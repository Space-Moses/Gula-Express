databases:
  - name: gula-db
    plan: free
    databaseName: gula
    user: gula
services:
  - type: web
    name: gula-express
    runtime: node
    plan: free
    rootDir: gula-express
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PGSSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gula-db
          property: connectionString
